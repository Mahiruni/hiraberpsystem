name: Restore Hisab ERP brand

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-hisab-brand.yml'

permissions:
  contents: write

jobs:
  restore-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Hisab ERP naming
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          skip_dirs = {'.git', 'node_modules', '.next'}
          text_exts = {'.tsx', '.ts', '.jsx', '.js', '.css', '.md', '.json', '.mjs', '.svg', '.html'}
          replacements = [
              ('sales@aethererp.com', 'mahir@hisabtech.com'),
              ('aether.company', 'hisabtech.com'),
              ('AetherERP', 'Hisab ERP'),
              ('Aether ERP', 'Hisab ERP'),
              ('Aether', 'Hisab'),
              ('aether-erp-marketing', 'hisab-erp-marketing'),
              ('aethererp', 'hisaberp'),
              ('aether', 'hisab'),
          ]

          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              if path.suffix.lower() not in text_exts:
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/restore-hisab-brand.yml

      - name: Commit brand restoration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'Hisab ERP Brand Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Keep Hisab ERP brand name'
          git push origin HEAD:main
